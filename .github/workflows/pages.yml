name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -B scripts/build.py
      - run: python3 -B scripts/check.py
      - run: node --test tests/*.test.mjs
      - run: python3 -B scripts/subpath_check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
  browser-qa:
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -B scripts/build.py
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check the deployed showcase in Chromium
        env:
          SHOWCASE_URL: https://spicmaff.github.io/rendezvous-grid-mazes/
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.js" BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-qa" node tests/browser/live.mjs
      - name: Save real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: ${{ runner.temp }}/browser-qa
          if-no-files-found: error
