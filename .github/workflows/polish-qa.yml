name: Motion preflight in Chromium
on:
  push:
    branches: [polish-motion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -B scripts/build.py
      - run: python3 -B scripts/check.py
      - run: node --test tests/*.test.mjs
      - run: python3 -B scripts/subpath_check.py
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test the exact build before publication
        run: |
          mkdir -p "$RUNNER_TEMP/showcase-server/showcase"
          cp -a dist/. "$RUNNER_TEMP/showcase-server/showcase/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/showcase-server" > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.js" BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-qa" LOCAL_BROWSER_QA=1 SHOWCASE_URL=http://127.0.0.1:8765/showcase/ node tests/browser/live.mjs
      - name: Save real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-preflight
          path: ${{ runner.temp }}/browser-qa
          if-no-files-found: error
